<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alak Share - QR & Link File Sharing</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            width: 380px; 
            text-align: center; 
            backdrop-filter: blur(10px);
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        input::placeholder { color: #ddd; }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-weight: bold;
        }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }
        .upload-box:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        #qrcode {
            background: white;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- লগইন / রেজিস্টার ফর্ম সেকশন -->
    <div class="container" id="auth-section">
        <h2>Alak Share</h2>
        <p>Sign In / Register</p>
        <input type="text" id="email" placeholder="Email or Username">
        <input type="password" id="password" placeholder="Password">
        <div id="message" style="margin: 10px 0; font-size: 14px; color: #ff6b6b;"></div>
        <button onclick="registerEmail()">Register</button>
        <button onclick="loginEmail()">Login</button>
        <div style="margin-top: 15px;">
            <a href="#" onclick="forgotPassword(); return false;" style="color: #fff; text-decoration: underline;">Forgot Password?</a>
        </div>
    </div>

    <!-- ড্যাশবোর্ড ও ফাইল শেয়ারিং সেকশন -->
    <div class="container hidden" id="dashboard-section">
        <h2>Alak Share Dashboard</h2>
        <p id="user-display" style="color: #fbbf24; font-weight: bold;"></p>
        
        <!-- ফাইল আপলোড বক্স -->
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📁 Click to select file/photo</p>
            <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
            <p id="file-name" style="font-size: 13px; color: #e2e8f0; margin-top: 5px;"></p>
        </div>

        <button id="upload-btn" class="hidden" style="background: #10b981;" onclick="generateShareableLink()">Generate Link & QR</button>
        
        <!-- শেয়ারিং ফলাফল সেকশন -->
        <div id="share-result" class="hidden" style="margin-top: 20px;">
            <p style="font-size: 14px; font-weight: bold;">Shareable Link:</p>
            <input type="text" id="share-link-input" readonly style="font-size: 12px; text-align: center;">
            
            <p style="font-size: 14px; font-weight: bold; margin-top: 10px;">Scan QR Code:</p>
            <div id="qrcode"></div>
        </div>

        <button onclick="logoutUser()" style="background: #dc2626; margin-top: 20px;">Logout</button>
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBetwmdELGVPjA-gr2pumIB5DjzhMQemOk",
    authDomain: "alak-share.firebaseapp.com",
    projectId: "alak-share",
    storageBucket: "alak-share.firebasestorage.app",
    messagingSenderId: "263803430265",
    appId: "1:263803430265:web:5ac3a58c889bdd7be17ba8",
    measurementId: "G-W8XPJ5R59C"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let selectedFile = null;

  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');
          document.getElementById('user-display').innerText = "Welcome, " + user.email;
      } else {
          document.getElementById('auth-section').classList.remove('hidden');
          document.getElementById('dashboard-section').classList.add('hidden');
      }
  });

  window.registerEmail = function() {
      const inputVal = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!inputVal || !password) { document.getElementById('message').innerText = "Please fill in all fields."; return; }
      let finalEmail = inputVal.includes('@') ? inputVal : inputVal + "@alakshare.com";
      createUserWithEmailAndPassword(auth, finalEmail, password)
          .then(() => { document.getElementById('message').innerText = "Registration Successful!"; })
          .catch((error) => { document.getElementById('message').innerText = "Error: " + error.message; });
  };

  window.loginEmail = function() {
      const inputVal = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!inputVal || !password) { document.getElementById('message').innerText = "Please fill in all fields."; return; }
      let finalEmail = inputVal.includes('@') ? inputVal : inputVal + "@alakshare.com";
      signInWithEmailAndPassword(auth, finalEmail, password)
          .catch((error) => { document.getElementById('message').innerText = "Error: " + error.message; });
  };

  window.forgotPassword = function() {
      const inputVal = document.getElementById('email.value').trim(); // Safe handling fallback
      // Alternatively handling standard input lookup:
      const emailVal = document.getElementById('email').value.trim();
      if (!emailVal) { document.getElementById('message').innerText = "Please enter your Email/Username!"; return; }
      let finalEmail = emailVal.includes('@') ? emailVal : emailVal + "@alakshare.com";
      sendPasswordResetEmail(auth, finalEmail)
          .then(() => { document.getElementById('message').innerText = "Password reset link sent!"; });
  };

  window.logoutUser = function() {
      signOut(auth);
  };

  window.handleFileSelect = function(event) {
      selectedFile = event.target.files[0];
      if (selectedFile) {
          document.getElementById('file-name').innerText = "Selected: " + selectedFile.name;
          document.getElementById('upload-btn').classList.remove('hidden');
      }
  };

  window.generateShareableLink = function() {
      if (!selectedFile) return;
      
      // মূল ফাইলের শতভাগ কোয়ালিটি বজায় রেখে লিংক তৈরি করা হচ্ছে
      const fileURL = URL.createObjectURL(selectedFile);
      
      document.getElementById('share-result').classList.remove('hidden');
      document.getElementById('share-link-input').value = fileURL;
      
      // কিউআর কোড জেনারেট করা
      document.getElementById('qrcode').innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
          text: fileURL,
          width: 128,
          height: 128
      });
  };
</script>
</body>
</html>
