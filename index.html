<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলক শেয়ার</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: #111b21; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; }
        .screen.active { display: flex; }

        /* Header */
        .wa-header { background: #202c33; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: #fff; height: 60px; }
        .wa-header h2 { font-size: 18px; color: #00a884; }
        .wa-header-icons { display: flex; gap: 20px; font-size: 18px; color: #aebac1; cursor: pointer; position: relative; }

        /* Dropdown Menu */
        .dropdown-menu { display: none; position: absolute; right: 0; top: 35px; background: #233138; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 4px; width: 160px; z-index: 100; }
        .dropdown-menu div { padding: 12px 15px; font-size: 14px; color: #e9edef; cursor: pointer; }
        .dropdown-menu div:hover { background: #182229; }

        /* Tabs */
        .wa-tabs { display: flex; background: #202c33; border-bottom: 1px solid #222d34; }
        .wa-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; font-weight: 600; color: #8696a0; border-bottom: 3px solid transparent; cursor: pointer; }
        .wa-tab.active { color: #00a884; border-bottom: 3px solid #00a884; }

        /* Search Bar */
        .search-container { padding: 8px 12px; background: #111b21; }
        .search-box { background: #202c33; border-radius: 8px; display: flex; align-items: center; padding: 6px 12px; gap: 10px; }
        .search-box input { background: none; border: none; outline: none; color: #fff; width: 100%; font-size: 14px; }
        .search-box i { color: #8696a0; font-size: 14px; }

        /* Chat List */
        .chat-list { flex: 1; overflow-y: auto; background: #111b21; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; border-bottom: 1px solid #222d34; }
        .chat-item:hover { background: #202c33; }
        .chat-avatar { width: 45px; height: 45px; border-radius: 50%; background: #6b7c85; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; }
        .chat-info { flex: 1; }
        .chat-name { font-size: 16px; font-weight: 500; color: #e9edef; }
        .chat-last-msg { font-size: 13px; color: #8696a0; margin-top: 3px; }

        /* Chat Room */
        .chat-room { background: #0b141a; flex: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-room-header { background: #202c33; padding: 10px 15px; display: flex; align-items: center; gap: 12px; }
        .chat-room-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { background: #005c4b; padding: 8px 12px; border-radius: 7px; max-width: 75%; font-size: 14px; align-self: flex-end; }
        
        /* Footer */
        .chat-footer { background: #202c33; padding: 10px 15px; display: flex; align-items: center; gap: 12px; }
        .chat-footer i { font-size: 20px; color: #8696a0; cursor: pointer; }
        .chat-footer input { flex: 1; background: #2a3942; border: none; padding: 10px 15px; border-radius: 8px; color: #fff; outline: none; font-size: 14px; }

        /* Auth */
        .auth-box { padding: 30px; text-align: center; margin: auto; width: 100%; }
        .auth-box input { width: 100%; padding: 12px; background: #2a3942; border: none; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; text-align: center; font-size: 16px; }
        .auth-btn { width: 100%; padding: 12px; background: #00a884; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ১. লগইন স্ক্রিন -->
    <div class="screen active" id="loginScreen" style="justify-content:center;">
        <div class="auth-box">
            <i class="fa-brands fa-whatsapp" style="font-size: 70px; color: #00a884; margin-bottom: 20px;"></i>
            <h2 style="color: #fff; margin-bottom: 10px;">আলক শেয়ার-এ স্বাগতম</h2>
            <p style="color: #8696a0; font-size: 13px; margin-bottom: 25px;">চালু করতে আপনার মোবাইল নম্বর দিন</p>
            <input type="text" id="phoneInput" placeholder="+91 দিয়ে নম্বর লিখুন">
            <button class="auth-btn" onclick="goToProfile()">পরবর্তী</button>
        </div>
    </div>

    <!-- ২. প্রোফাইল সেটআপ স্ক্রিন -->
    <div class="screen" id="profileScreen" style="justify-content:center;">
        <div class="auth-box">
            <div style="width: 80px; height: 80px; background: #2a3942; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #8696a0;">
                <i class="fa-solid fa-camera"></i>
            </div>
            <h3 style="color: #fff; margin-bottom: 15px;">আপনার প্রোফাইল তথ্য দিন</h3>
            <input type="text" id="nameInput" placeholder="আপনার নাম লিখুন">
            <button class="auth-btn" onclick="goToDashboard()">প্রবেশ করুন</button>
        </div>
    </div>

    <!-- ৩. মূল ড্যাশবোর্ড -->
    <div class="screen" id="dashboardScreen">
        <div class="wa-header">
            <h2>আলক শেয়ার</h2>
            <div class="wa-header-icons">
                <i class="fa-solid fa-camera"></i>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-ellipsis-vertical" onclick="toggleMenu()"></i>
                <div class="dropdown-menu" id="menuDropdown">
                    <div onclick="alert('নতুন গ্রুপ তৈরি')">নতুন গ্রুপ</div>
                    <div onclick="alert('প্রোফাইল সেটিংস')">প্রোফাইল</div>
                    <div onclick="location.reload()">লগআউট</div>
                </div>
            </div>
        </div>

        <div class="wa-tabs">
            <div class="wa-tab active">চ্যাট</div>
            <div class="wa-tab" onclick="alert('স্ট্যাটাস ফিচার')">স্ট্যাটাস</div>
            <div class="wa-tab" onclick="alert('কল হিস্ট্রি')">কলস</div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="চ্যাট বা কন্টাক্ট সার্চ করুন...">
            </div>
        </div>

        <div class="chat-list">
            <div class="chat-item" onclick="openChatRoom('ফাইল শেয়ার ও কোড জেনারেটর')">
                <div class="chat-avatar"><i class="fa-solid fa-file-arrow-down"></i></div>
                <div class="chat-info">
                    <div class="chat-name">ফাইল শেয়ারিং রুম</div>
                    <div class="chat-last-msg">লিংক থেকে কোড বা কোড থেকে ফাইল পান</div>
                </div>
            </div>
            <div class="chat-item" onclick="openChatRoom('সাধারণ চ্যাট')">
                <div class="chat-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-name" id="displayProfileName">আলক দাস</div>
                    <div class="chat-last-msg">চ্যাট শুরু করুন...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ৪. চ্যাট রুম (যেখান থেকে ভিডিও কল ও ফাইল শেয়ার করা যাবে) -->
    <div class="screen" id="chatRoomScreen">
        <div class="chat-room-header">
            <i class="fa-solid fa-arrow-left" onclick="goBackToDashboard()" style="cursor:pointer; font-size: 18px; color: #8696a0;"></i>
            <div class="chat-avatar" style="width: 35px; height: 35px; font-size: 16px;">💬</div>
            <div style="flex: 1;" id="activeChatTitle">চ্যাট রুম</div>
            <div style="display: flex; gap: 20px; font-size: 18px; color: #8696a0;">
                <i class="fa-solid fa-video" onclick="alert('ভিডিও কল শুরু হচ্ছে...')"></i>
                <i class="fa-solid fa-phone" onclick="alert('ভয়েস কল শুরু হচ্ছে...')"></i>
            </div>
        </div>

        <div class="chat-room-body" id="chatBody">
            <div class="message-bubble">স্বাগতম! এখানে মেসেজ ও ফাইল শেয়ার করতে পারেন।</div>
        </div>

        <div class="chat-footer">
            <i class="fa-regular fa-face-smile"></i>
            <i class="fa-solid fa-paperclip" onclick="triggerFileSharePrompt()"></i>
            <input type="text" id="msgInput" placeholder="মেসেজ লিখুন...">
            <i class="fa-solid fa-microphone" id="micBtn"></i>
            <i class="fa-solid fa-paper-plane" onclick="sendMsg()" style="color: #00a884; display:none;" id="sendBtn"></i>
        </div>
    </div>

</div>

<script>
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToProfile() {
        if(document.getElementById('phoneInput').value.trim() === '') {
            alert('দয়া করে মোবাইল নম্বর দিন!');
            return;
        }
        showScreen('profileScreen');
    }

    function goToDashboard() {
        const name = document.getElementById('nameInput').value.trim();
        if(name !== '') {
            document.getElementById('displayProfileName').innerText = name;
        }
        showScreen('dashboardScreen');
    }

    function toggleMenu() {
        const menu = document.getElementById('menuDropdown');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function openChatRoom(title) {
        document.getElementById('activeChatTitle').innerText = title;
        showScreen('chatRoomScreen');
    }

    function goBackToDashboard() {
        showScreen('dashboardScreen');
    }

    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    msgInput.addEventListener('input', function() {
        if(this.value.trim().length > 0) {
            sendBtn.style.display = 'block';
            micBtn.style.display = 'none';
        } else {
            sendBtn.style.display = 'none';
            micBtn.style.display = 'block';
        }
    });

    function sendMsg() {
        const text = msgInput.value.trim();
        if(text) {
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML += `<div class="message-bubble">${text}</div>`;
            msgInput.value = '';
            sendBtn.style.display = 'none';
            micBtn.style.display = 'block';
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    }

    function triggerFileSharePrompt() {
        let link = prompt("গুগল ড্রাইভ বা ফাইল লিংক দিন (যার ইউনিক কোড তৈরি হবে):");
        if(link) {
            let code = "ALAK-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem(code, link);
            alert("ফাইল সফলভাবে যুক্ত হয়েছে! আপনার ইউনিক কোডটি হলো: " + code + "\n(এই কোডটি অন্যকে পাঠান)");
        }
    }
</script>

</body>
</html>
