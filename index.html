<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAK SHARE - Free File Sharing Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #ddd;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            padding: 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-box:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: #ff4b2b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        .upload-btn:hover {
            background: #ff416c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 ALAK SHARE</h1>
        <p>Share your large files securely with original quality retention.</p>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📁 Tap here to select files</p>
            <input type="file" id="fileInput">
        </div>

        <button class="upload-btn">Upload & Generate Link</button>
    </div>

</body>
</html>
