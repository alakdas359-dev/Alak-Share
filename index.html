<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alak Share - File Sharing Platform</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: #fff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        /* টপ-রাইট কর্নার বাটন স্টাইল */
        .top-corner-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .top-corner-btn:hover { background: #b91c1c; }

        .container { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            width: 400px; 
            text-align: center; 
            backdrop-filter: blur(10px);
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        input::placeholder { color: #ddd; }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-weight: bold;
        }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            padding: 25px;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }
        .upload-box:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        #qrcode {
            background: white;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- ড্যাশবোর্ডের কোণায় থাকবে লগআউট বাটন -->
    <button id="logout-btn" class="top-corner-btn hidden" onclick="logoutUser()">Logout</button>

    <!-- লগইন / রেজিস্টার ফর্ম সেকশন -->
    <div class="container" id="auth-section">
        <h2>Alak Share</h2>
        <p>Sign In / Register</p>
        <input type="text" id="email" placeholder="Email or Username">
        <input type="password" id="password" placeholder="Password">
        <div id="message" style="margin: 10px 0; font-size: 14px; color: #ff6b6b;"></div>
        <button onclick="registerEmail()">Register</button>
        <button onclick="loginEmail()">Login</button>
        <div style="margin-top: 15px;">
            <a href="#" onclick="forgotPassword(); return false;" style="color: #fff; text-decoration: underline;">Forgot Password?</a>
        </div>
    </div>

    <!-- সুন্দর ড্যাশবোর্ড ও ফাইল শেয়ারিং সেকশন -->
    <div class="container hidden" id="dashboard-section">
        <h2>Dashboard</h2>
        <p id="user-display" style="color: #fbbf
