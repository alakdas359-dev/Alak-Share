<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলক শেয়ার - প্রফেশনাল চ্যাট ও ফাইল শেয়ারিং</title>
    
    <!-- ফায়ারবেস SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042) !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            min-height: 100vh !important;
            color: #ffffff !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .page {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-top: auto;
            margin-bottom: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 22px;
        }

        p {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: 0.3s;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        /* চ্যাট ও ফাইল শেয়ারিং স্টাইল */
        .app-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header h3 {
            font-size: 18px;
            color: #38bdf8;
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
        }

        .tab-btn.active {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid rgba(0, 255, 128, 0.3);
            border-radius: 10px;
            font-size: 13px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ১. লগইন পেজ -->
    <div class="page active" id="pageLogin">
        <div class="glass-card">
            <h2>আলক শেয়ার - লগইন</h2>
            <p>১. আপনার মোবাইল নম্বর দিয়ে সাইন-আপ ও ওটিপি ভেরিফিকেশন করুন।</p>
            <input type="text" id="phoneNumber" placeholder="+91 দিয়ে আপনার নম্বর লিখুন">
            <button class="btn-main" onclick="sendOTPCode()">ওটিপি পাঠান</button>
            
            <div id="otpBox" style="display:none; margin-top:15px;">
                <input type="text" id="otpCode" placeholder="৬ ডিজিটের ওটিপি কোড লিখুন">
                <button class="btn-main" onclick="verifyOTPCode()">ভেরিফাই করুন</button>
            </div>
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <!-- ২. প্রোফাইল কাস্টমাইজেশন পেজ -->
    <div class="page" id="pageProfile">
        <div class="glass-card">
            <h2>প্রোফাইল কাস্টমাইজেশন</h2>
            <p>আপনার নাম ও বিবরণ লিখে অ্যাকাউন্ট সেটআপ করুন।</p>
            <input type="text" id="userName" placeholder="আপনার নাম লিখুন">
            <input type="text" id="userAbout" placeholder="আপনার বিবরণ (About) লিখুন">
            <button class="btn-main" onclick="saveProfileData()">সেভ করে এগিয়ে যান</button>
        </div>
    </div>

    <!-- ৩. মূল চ্যাট ও ফাইল শেয়ারিং রুম পেজ -->
    <div class="page" id="pageChatRoom">
        <div class="app-header">
            <h3>আলক শেয়ার (WhatsApp Pro)</h3>
            <span style="font-size: 12px; color: #4ade80;" id="profileDisplayName">Online</span>
        </div>

        <div style="padding: 15px; flex: 1; overflow-y: auto;">
            <!-- নেভিগেশন ট্যাব -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('chatTab', this)">চ্যাট রুম</button>
                <button class="tab-btn" onclick="switchTab('fileTab', this)">ফাইল টু কোড</button>
            </div>

            <!-- চ্যাট ট্যাব -->
            <div id="chatTab" class="tab-content active">
                <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; height: 250px; overflow-y: auto; margin-bottom: 15px; display:flex; flex-direction:column; gap:10px;">
                    <div style="background: rgba(14,165,233,0.2); padding: 8px 12px; border-radius: 8px; max-width:80%;">স্বাগতম! আপনার চ্যাট রুম সচল রয়েছে।</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." style="margin-bottom:0;">
                    <button class="btn-main" style="width: 80px;" onclick="sendMessage()">পাঠান</button>
                </div>
            </div>

            <!-- ফাইল থেকে ইউনিক কোড তৈরি ট্যাব (আপনার স্পেশাল ফিচার) -->
            <div id="fileTab" class="tab-content">
                <div class="glass-card" style="margin: 0; padding: 15px;">
                    <p style="margin-bottom: 10px;">ড্রাইভ লিংক থেকে কোড তৈরি বা কোড দিয়ে ফাইল খুঁজুন:</p>
                    <input type="text" id="fileLinkInput" placeholder="গুগল ড্রাইভ বা ফাইল লিংক দিন">
                    <button class="btn-main" onclick="generateCodeAction()" style="margin-bottom: 10px;">কোড তৈরি করুন</button>
                    
                    <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                        <input type="text" id="searchCodeInput" placeholder="কোডটি এখানে লিখুন (যেমন: ALAK-XXXX)">
                        <button class="btn-main" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="searchFileAction()">ফাইল খুঁজুন ও ডাউনলোড করুন</button>
                    </div>

                    <div id="fileResultBox" class="result-box"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // ফায়ারবেস কনফিগারেশন (আপনার ফায়ারবেস অ্যাকাউন্ট থেকে এনে এখানে বসিয়ে নেবেন)
    const firebaseConfig = {
  apiKey: "AIzaSyBetwmdELGVPjA-gr2pumIB5DjzhMQemOk",
  authDomain: "alak-share.firebaseapp.com",
  projectId: "alak-share",
  storageBucket: "alak-share.firebasestorage.app",
  messagingSenderId: "263803430265",
  appId: "1:263803430265:web:e2b5ec3ac69305d8e17ba8",
  measurementId: "G-J1MYVT01NN"
};

    // যদি ফায়ারবেস কনফিগার করা না থাকে তবে লোকাল টেস্টিংয়ের জন্য পেজ পরিবর্তনের শর্টকাট ব্যবস্থা রাখা হয়েছে
    try {
        firebase.initializeApp(firebaseConfig);
    } catch(e) { console.log("Firebase initialized locally"); }

    // পেজ পরিবর্তনের ফাংশন
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // ওটিপি পাঠানোর সিমুলেশন বা ফায়ারবেস ট্রিগার
    function sendOTPCode() {
        const phone = document.getElementById('phoneNumber').value;
        if(phone.length < 10) {
            alert("দয়া করে সঠিক মোবাইল নম্বর দিন!");
            return;
        }
        document.getElementById('otpBox').style.display = 'block';
        alert("ডেমো মোড: আপনার ওটিপি পাঠানো হয়েছে (যেকোনো কোড দিয়ে এগিয়ে যেতে পারেন)।");
    }

    // ওটিপি ভেরিফিকেশন ও প্রোফাইল পেজে যাওয়া
    function verifyOTPCode() {
        // সফল ভেরিফিকেশনের পর প্রোফাইল পেজে নিয়ে যাবে
        showPage('pageProfile');
    }

    // প্রোফাইল সেভ করার ফাংশন
    function saveProfileData() {
        const name = document.getElementById('userName').value;
        if(!name) {
            alert("দয়া করে আপনার নাম লিখুন!");
            return;
        }
        document.getElementById('profileDisplayName').innerText = name;
        showPage('pageChatRoom');
    }

    // চ্যাট ও ফাইল ট্যাব সুইচিং
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // মেসেজ পাঠানোর ফাংশন
    function sendMessage() {
        const msg = document.getElementById('messageInput').value;
        if(msg) {
            alert("মেসেজ পাঠানো হয়েছে: " + msg);
            document.getElementById('messageInput').value = '';
        }
    }

    // ১. ফাইল লিংক থেকে ইউনিক কোড তৈরি করার লজিক
    function generateCodeAction() {
        const link = document.getElementById('fileLinkInput').value;
        const resultBox = document.getElementById('fileResultBox');
        
        if(!link) {
            alert("দয়া করে একটি ফাইল বা ড্রাইভ লিংক দিন!");
            return;
        }

        const uniqueCode = "ALAK-" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem(uniqueCode, link);

        resultBox.style.display = 'block';
        resultBox.innerHTML = `<b>সফল! কোড তৈরি হয়েছে:</b> <span style="color:#38bdf8; font-size:15px; font-weight:bold;">${uniqueCode}</span><br>এই কোডটি অন্যকে পাঠান।`;
    }

    // ২. কোড দিয়ে ফাইল খুঁজে বের করা ও ডাউনলোডের লিংক দেখানোর লজিক
    function searchFileAction() {
        const code = document.getElementById('searchCodeInput').value.trim();
        const resultBox = document.getElementById('fileResultBox');

        if(!code) {
            alert("দয়া করে কোডটি লিখুন!");
            return;
        }

        const savedLink = localStorage.getItem(code);
        resultBox.style.display = 'block';

        if(savedLink) {
            resultBox.innerHTML = `<b>ফাইল পাওয়া গেছে!</b><br><a href="${savedLink}" target="_blank" style="color:#38bdf8; text-decoration:underline;">এখানে ক্লিক করে ফাইলটি ডাউনলোড করুন</a>`;
        } else {
            resultBox.innerHTML = `<span style="color:#f87171;">দুঃখিত, এই কোড দিয়ে কোনো ফাইল পাওয়া যায়নি!</span>`;
        }
    }
</script>

</body>
</html>
